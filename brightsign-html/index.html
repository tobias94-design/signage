<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PixelBridge</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: #050e1a;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  #screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #fff;
  }
  .logo { font-size: 42px; color: #F7192E; font-weight: bold; margin-bottom: 40px; }
  .code { font-size: 120px; font-weight: 900; letter-spacing: 16px; color: #fff; font-family: monospace; }
  .hint { font-size: 26px; color: #888; margin-top: 30px; }
  .status { font-size: 18px; color: #444; margin-top: 40px; }
</style>
</head>
<body>
<div id="screen">
  <div class="logo">PixelBridge</div>
  <div class="code" id="code">--------</div>
  <div class="hint">Inserisci questo codice nel pannello admin</div>
  <div class="status" id="status">Connessione in corso...</div>
</div>
<script>
var SERVER = "https://pixelbridge.it";
var MACHINE = "BrightSign-XT1144";

function status(msg) {
  document.getElementById("status").textContent = msg;
}

function genera() {
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var code = "";
  for (var i = 0; i < 8; i++) {
    code += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return code;
}

function avvia() {
  var code = genera();
  document.getElementById("code").textContent = code;

  fetch(SERVER + "/api/claim.php?action=register&code=" + code + "&machine=" + encodeURIComponent(MACHINE))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        status("In attesa di conferma dal pannello admin...");
        poll(code);
      } else {
        status("Errore registrazione, riprovo...");
        setTimeout(avvia, 5000);
      }
    })
    .catch(function() {
      status("Errore di rete, riprovo tra 5s...");
      setTimeout(avvia, 5000);
    });
}

function poll(code) {
  fetch(SERVER + "/api/claim.php?action=check&code=" + code)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok && data.status === "claimed" && data.token) {
        status("Associazione completata! Avvio...");
        setTimeout(function() {
          window.location.href = SERVER + "/player/display.php?token=" + data.token;
        }, 1500);
      } else if (data.status === "expired") {
        status("Codice scaduto, genero nuovo codice...");
        setTimeout(avvia, 2000);
      } else {
        setTimeout(function() { poll(code); }, 3000);
      }
    })
    .catch(function() {
      setTimeout(function() { poll(code); }, 3000);
    });
}

avvia();
</script>
</body>
</html>
